[project]
name = "filed"
version = "0.1.0"
description = "Which US employers file H-1B paperwork, from DOL and USCIS public records"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "psycopg[binary]>=3.2",
    "pypdf>=5.0",
    "python-calamine>=0.8.2",
]

[project.optional-dependencies]
# Only for `filed fetch` / `filed push-raw` against an S3-compatible bucket.
store = ["boto3>=1.34"]

[project.scripts]
filed = "etl.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["etl"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
